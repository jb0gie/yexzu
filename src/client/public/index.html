<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    
    <!-- Farcaster Mini App Meta (only used when in Farcaster context) -->
    <meta name="farcaster:miniapp" content="v0.1.0" />
    <meta name="farcaster:frame" content="vNext" />
    
    <title>{title}</title>
    <meta name="description" content="{desc}" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{url}" />
    <meta property="og:title" content="{title}" />
    <meta property="og:description" content="{desc}" />
    <meta property="og:image" content="{image}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{url}" />
    <meta name="twitter:title" content="{title}" />
    <meta name="twitter:description" content="{desc}" />
    <meta name="twitter:image" content="{image}" />
    
    <!-- Farcaster Frame Meta -->
    <meta property="fc:frame" content="vNext" />
    <meta property="fc:frame:image" content="{image}" />
    <meta property="fc:frame:button:1" content="Enter World" />
    <meta property="fc:frame:button:1:action" content="link" />
    <meta property="fc:frame:button:1:target" content="/" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/rubik.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/base-environment.glb" as="fetch" crossorigin />
    <link rel="preload" href="/day2-2k.jpg" as="image" />
    <link rel="stylesheet" type="text/css" href="/index.css?v={buildId}" />
    
    <style>
      * {
        box-sizing: border-box;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Rubik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #000;
        color: #fff;
      }
      
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #8866ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 14px;
        opacity: 0.7;
      }
      
      @media (max-width: 768px) {
        .loading-text {
          font-size: 12px;
        }
      }
    </style>
    
    <script>
      window.PARTICLES_PATH = '{particlesPath}'
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Hyperfy...</div>
      </div>
    </div>
    
    <script src="/env.js?v={buildId}"></script>
    
    <script type="module">
      // Set up environment
      window.env = window.env || {}
      window.env.PUBLIC_WS_URL = window.env.PUBLIC_WS_URL || (() => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:'
        const hostname = window.location.hostname
        return `${protocol}//${hostname}/ws`
      })()
      
      // Detect if we're in Farcaster context, but allow override for full experience
      const urlParams = new URLSearchParams(window.location.search)
      const forceFullApp = urlParams.has('full') || urlParams.has('desktop') || 
                          window.location.hash.includes('full') ||
                          urlParams.has('browser') || urlParams.has('force')
      
      // If user explicitly wants full app, don't check Farcaster context at all
      const isFarcaster = !forceFullApp && (
        window.navigator.userAgent.toLowerCase().includes('farcaster') || 
        window.location.search.includes('farcaster')
        // Removed iframe check as it can be too aggressive for new tabs
      )
      
      async function loadApp() {
        try {
          // Debug logging
          console.log('Detection results:', {
            userAgent: window.navigator.userAgent,
            search: window.location.search,
            urlParams: Object.fromEntries(urlParams),
            forceFullApp,
            isFarcaster,
            parentWindow: window.parent !== window
          })
          
          if (isFarcaster) {
            // Load Farcaster Mini App
            window.env.MINIAPP_MODE = true
            console.log('Loading Farcaster Mini App mode')
            const { default: initMiniApp } = await import('/miniapp.js')
            // miniapp.js handles its own initialization
          } else {
            // Load regular Hyperfy app
            console.log('Loading full Hyperfy app from:', '{jsPath}')
            const { default: initApp } = await import('{jsPath}')
            // Regular app handles its own initialization
          }
        } catch (error) {
          console.error('Failed to load app:', error)
          const root = document.getElementById('root')
          root.innerHTML = `
            <div class="loading">
              <div style="color: #ff6666;">Failed to load Hyperfy</div>
              <div class="loading-text">Please try refreshing the page</div>
            </div>
          `
        }
      }
      
      loadApp()
    </script>
  </body>
</html>
